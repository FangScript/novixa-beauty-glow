name: Deploy to cPanel

on:
  push:
    branches:
      - main   # Triggers on every push to main

jobs:
  deploy:
    name: Deploy to novixaretail.com
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          script: |
            set -e
            echo "=== Pulling latest code from GitHub ==="
            cd /home/noviqzwh/novixa
            git pull origin main

            echo "=== Installing dependencies ==="
            npm install --omit=dev --legacy-peer-deps

            echo "=== Generating Prisma client ==="
            npm run db:generate

            echo "=== Building Next.js ==="
            npm run build

            echo "=== Running database migrations ==="
            node_modules/.bin/prisma migrate deploy

            echo "=== Restarting Passenger app ==="
            mkdir -p tmp
            touch tmp/restart.txt

            echo "✅ Deploy complete — novixaretail.com is live!"

