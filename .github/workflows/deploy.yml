name: Deploy to cPanel (novixaretail.com)

on:
  push:
    branches:
      - main

jobs:
  # ── Job 1: Build on GitHub's servers (no shared-host resource limits) ──
  build:
    name: Build Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Create .env for build
        run: |
          cat > .env << 'EOF'
          APP_URL=https://www.novixaretail.com
          NODE_ENV=production
          AUTH_URL=https://www.novixaretail.com
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          PAYMENT_PROVIDER=PAYPAL
          PAYPAL_CLIENT_ID=${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET=${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE=sandbox
          NEXT_PUBLIC_PAYPAL_CLIENT_ID=${{ secrets.PAYPAL_CLIENT_ID }}
          EMAIL_PROVIDER=GMAIL
          EMAIL_FROM=NOVIXA <novixaretail@gmail.com>
          SUPPORT_EMAIL=novixaretail@gmail.com
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=465
          SMTP_USER=novixaretail@gmail.com
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          EOF

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1

  # ── Job 2: Deploy built files to cPanel server ──
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: build   # only runs after build succeeds

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/

      - name: Upload .next to cPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT }}

      - name: Copy built files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          source: ".next/"
          target: "/home/noviqzwh/novixa/"

      - name: Pull code + migrate + restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          script: |
            export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH
            cd /home/noviqzwh/novixa

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Installing production deps ==="
            npm install --omit=dev --legacy-peer-deps

            echo "=== Running DB migrations ==="
            node_modules/.bin/prisma migrate deploy

            echo "=== Restarting Passenger ==="
            mkdir -p tmp && touch tmp/restart.txt

            echo "✅ novixaretail.com is live!"


