# ──────────────────────────────────────────────────────────────────────────────
# Novixa Beauty Glow — Docker Compose (Production)
# Uses external managed database (Supabase PostgreSQL)
# Usage: docker compose -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Next.js Application ───────────────────────────────────────────────────
  app:
    image: novixa-beauty-glow:${IMAGE_TAG:-latest}
    container_name: novixa-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Prisma Migrations (run once against Supabase, then exit) ──────────────
  migrate:
    image: novixa-beauty-glow:${IMAGE_TAG:-latest}
    container_name: novixa-migrate
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    command: ["npx", "-y", "prisma@6.19.0", "migrate", "deploy"]
    restart: "no"
    profiles:
      - migration
