---
deployment:
  tasks:
    # 1. Install production dependencies
    - /usr/local/bin/node /usr/local/bin/npm install --omit=dev --legacy-peer-deps

    # 2. Generate Prisma client
    - /usr/local/bin/node /usr/local/bin/npm run db:generate

    # 3. Build the Next.js app
    - /usr/local/bin/node /usr/local/bin/npm run build

    # 4. Run database migrations (safe - only applies pending)
    - /usr/local/bin/node node_modules/.bin/prisma migrate deploy

    # 5. Restart the Node.js Passenger app
    - touch /home/noviqzwh/novixa/tmp/restart.txt
